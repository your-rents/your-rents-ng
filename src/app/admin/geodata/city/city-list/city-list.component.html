<div class="mat-elevation-z8">
  <mat-paginator
    [length]="resultsLength"
    [pageSize]="20"
    aria-label="Select page of Cities search results"
  ></mat-paginator>
  @if (isLoadingResults) {
  <div class="absolute top-0 left-0 bottom-0 right-0 bg-slate-500/50 z-10 flex items-center justify-center">
    <mat-spinner></mat-spinner>
  </div>
  }
  <div class="overflow-auto">
    <table
      mat-table
      [dataSource]="data"
      matSort
      matSortActive="name"
      matSortDisableClear
      matSortDirection="asc"
    >
      <ng-container matColumnDef="uuid">
        <th mat-header-cell *matHeaderCellDef>UUID</th>
        <td mat-cell *matCellDef="let row">{{ row.uuid }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
          Name
        </th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>

      <ng-container matColumnDef="localData.itCodiceIstat">
        <th mat-header-cell *matHeaderCellDef>Codice Istat (IT)</th>
        <td mat-cell *matCellDef="let row">
          {{ row.localData.itCodiceIstat }}
        </td>
      </ng-container>

      <ng-container matColumnDef="localData.itCodiceErariale">
        <th mat-header-cell *matHeaderCellDef>Codice Erariale (IT)</th>
        <td mat-cell *matCellDef="let row">
          {{ row.localData.itCodiceErariale }}
        </td>
      </ng-container>

      <ng-container matColumnDef="province.name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>Provincia</th>
        <td mat-cell *matCellDef="let row">{{ row.province.name }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
  <mat-paginator
    [length]="resultsLength"
    [pageSize]="20"
    aria-label="Select page of Cities search results"
  ></mat-paginator>
</div>
