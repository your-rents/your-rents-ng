<mat-card>
  <mat-card-header>
    <mat-card-title>YourRents</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @switch (translocoService.getActiveLang()) {
        @case('it') {
            <p>YourRents è un'applicazione per la gestione dei tuoi immobili.</p>
        }
        @default {
            <p>YourRents is an application for managing your real estate.</p>
        }
    }
  </mat-card-content>
</mat-card>
